
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netson-ai"
version = "0.1.0"
description = "A Python-based IPv4 network diagnostic tool."
requires-python = ">=3.10"

[project.scripts]
netson = "netson.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
